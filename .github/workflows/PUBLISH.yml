name: Publish Package

on:
  push:
    branches:
      - beta
      - main

jobs:
  publish-package:
    name: Publish Package to NPM and GitHub
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token para npm provenance (auto-detectado por libnpmpublish vía
      # GITHUB_ACTIONS + repo público) y para Trusted Publishing (detectado
      # por el comando `npm publish` real — ver el paso "Publish to NPM").
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      # Trusted Publishing (OIDC) requiere npm >= 11.5.1; el npm bundleado con Node 22.14.0 es menor.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Configure Git Identity
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Set Release Type Variables
        id: set_vars
        run: |
          if [[ $GITHUB_REF == 'refs/heads/beta' ]]; then
            echo "BRANCH=beta" >> $GITHUB_OUTPUT
            echo "VERSION_ARGS=--conventional-commits --conventional-prerelease --preid beta" >> $GITHUB_OUTPUT
            echo "DIST_TAG=beta" >> $GITHUB_OUTPUT
            echo "CREATE_GITHUB_RELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=main" >> $GITHUB_OUTPUT
            echo "VERSION_ARGS=--conventional-commits --conventional-graduate --create-release github" >> $GITHUB_OUTPUT
            echo "DIST_TAG=latest" >> $GITHUB_OUTPUT
            echo "CREATE_GITHUB_RELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Lerna Version
        run: |
          VERSION_OLD=$(node -p "require('./lerna.json').version")
          echo "VERSION_OLD=$VERSION_OLD" >> $GITHUB_ENV
          npm exec --no -- lerna version ${{ steps.set_vars.outputs.VERSION_ARGS }} --yes
          VERSION_NEW=$(node -p "require('./lerna.json').version")
          echo "VERSION_NEW=$VERSION_NEW" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.PUSH_BRANCHES_BLOCKED }}

      - name: Check for Changes
        id: lerna_check
        run: |
          if [[ "${{ env.VERSION_OLD }}" == "${{ env.VERSION_NEW }}" ]]; then
            echo "👷 No new version bump: ${{ env.VERSION_OLD }} — building/publishing anyway"
          else
            echo "🎉 New version (${{ steps.set_vars.outputs.BRANCH }}): ${{ env.VERSION_NEW }}"
          fi

      # Build y Publish corren SIEMPRE (no solo cuando lerna detecta un bump
      # nuevo): el loop de `npm publish` de abajo es idempotente por paquete
      # (npm view decide si ya está publicado), así que si algo quedó
      # bumpeado en git pero nunca publicado de verdad (ej. un run anterior
      # falló en el publish real), el siguiente push a beta/main lo
      # recupera solo — sin depender de que aparezca un commit nuevo que
      # fuerce otro bump.
      - name: Build packages
        run: |
          npm run build
          echo "📦 Build completed!"

      - name: Publish to NPM
        run: |
          # `lerna publish` NO usa Trusted Publishing (OIDC): llama a la librería
          # libnpmpublish directo, nunca ejecuta el comando `npm publish` del CLI
          # real — y el intercambio OIDC de Trusted Publishing vive únicamente en
          # `npm/lib/commands/publish.js` (verificado en el código fuente de npm).
          # Por eso se publica paquete por paquete con `npm publish` real: solo
          # ese comando dispara la detección OIDC.
          DIST_TAG="${{ steps.set_vars.outputs.DIST_TAG }}"
          for pkg_dir in packages/*/; do
            PKG_NAME=$(node -p "require('./${pkg_dir}package.json').name")
            PKG_VERSION=$(node -p "require('./${pkg_dir}package.json').version")
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "⏭️  $PKG_NAME@$PKG_VERSION ya está publicado, se omite"
            else
              echo "🚀 Publicando $PKG_NAME@$PKG_VERSION (tag: $DIST_TAG)"
              (cd "$pkg_dir" && npm publish --tag "$DIST_TAG")
            fi
          done
          echo "🚀 Versión v${{ env.VERSION_NEW }} publicada a NPM con tag $DIST_TAG"
