name: ZanobiJS CI-CD Validation

on:
  pull_request:
    branches: [develop, beta, main]
    types: [opened, reopened, edited, synchronize]

jobs:
  validate-branch:
    name: Validate Branch and Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "🔍 Checking PR title for conventional commit format"
          if [[ "$PR_TITLE" =~ ^(chore|ci|docs|feat|fix|style|refactor|test|sample|build|revert).*: ]]; then
            echo "✅ PR title is valid: $PR_TITLE"
          else
            echo "❌ Error: PR title does not follow Conventional Commits format."
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  feat(core): add ability to parse arrays"
            echo "  ci: ✨ PR title validation was added"
            echo "  fix(core): 🐛 resolve login issue"
            exit 1
          fi

      - name: Check branch name pattern
        if: github.base_ref == 'develop'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(chore|ci|docs|feat|fix|style|refactor|test|sample|build|revert)\/.+ ]]; then
            echo "✅ Branch name $BRANCH_NAME follows the required naming convention"
          else
            echo "❌ Error: Branch name $BRANCH_NAME does not follow the required naming convention"
            echo "Branch must follow naming conventions defined in CONTRIBUTING.md"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    needs: [validate-branch]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint:check
        continue-on-error: false

      - name: Prettier check
        run: npm run prettier:check
        continue-on-error: false

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: false

      - name: Check test coverage
        env:
          MIN_COVERAGE: ${{ vars.MIN_COVERAGE || 100 }}
        run: |
          set -euo pipefail
          SUMMARY=coverage/coverage-summary.json
          if [[ ! -f "$SUMMARY" ]]; then
            echo "❌ Error: $SUMMARY not found. Did the coverage run emit the json-summary reporter?"
            exit 1
          fi
          COVERAGE=$(node -p "require('./$SUMMARY').total.lines.pct")
          echo "Test coverage (lines): $COVERAGE%"
          echo "Minimum required coverage: $MIN_COVERAGE%"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Error: Test coverage is below $MIN_COVERAGE%. Current coverage: $COVERAGE%"
            exit 1
          fi
          echo "✅ Coverage gate passed"

      - name: Check if changes are inside packages
        id: check_changes
        run: |
          echo "🔍 Checking for changes inside packages or workflows"
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # .github/workflows/ se incluye para que Sonar reescanee sus reglas
          # de GitHub Actions cuando cambian los workflows, no solo el código.
          if echo "$CHANGED_FILES" | grep -qE '^(packages/|\.github/workflows/)'; then
            echo "✅ Changes detected inside packages or workflows"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "🟡 No relevant changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: SonarQube Scan
        if: steps.check_changes.outputs.changed == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # v8 cambió el default a false; se mantiene el comportamiento previo explícito
          skipSignatureVerification: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_OPTS: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: SonarQube Quality Gate check
        if: steps.check_changes.outputs.changed == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build
        run: npm run build
        continue-on-error: false
