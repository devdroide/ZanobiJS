version: 2

updates:
  # Monorepo con npm workspaces (packages/common, packages/core) — Dependabot
  # detecta los workspaces automáticamente desde la raíz.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"

  # Actions ya pineadas por SHA completo (SEC-CI) — Dependabot avisa cuando
  # hay una versión nueva, sin bajar la guardia del pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "ci"
